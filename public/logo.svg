<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4B4B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8585;stop-opacity:1" />
    </linearGradient>
    <filter id="dropshadow" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Main Container: Stylized Media/Timeline Card -->
  <rect x="64" y="96" width="384" height="320" rx="48" fill="white" filter="url(#dropshadow)"/>
  
  <!-- Accent Border/Fill -->
  <rect x="64" y="96" width="384" height="320" rx="48" fill="none" stroke="url(#primaryGradient)" stroke-width="16"/>

  <!-- Visual Elements -->
  <g transform="translate(64, 96)">
    
    <!-- Audio Waveform (Stylized as 3 bars) -->
    <rect x="58" y="80" width="16" height="40" rx="8" fill="#FF4B4B" opacity="0.6">
        <animate attributeName="height" values="40;80;40" dur="2s" repeatCount="indefinite" />
        <animate attributeName="y" values="80;60;80" dur="2s" repeatCount="indefinite" />
    </rect>
    <rect x="84" y="60" width="16" height="80" rx="8" fill="#FF4B4B">
         <animate attributeName="height" values="80;120;80" dur="2.2s" repeatCount="indefinite" />
         <animate attributeName="y" values="60;40;60" dur="2.2s" repeatCount="indefinite" />
    </rect>
    <rect x="110" y="80" width="16" height="40" rx="8" fill="#FF4B4B" opacity="0.6">
        <animate attributeName="height" values="40;70;40" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="80;65;80" dur="1.8s" repeatCount="indefinite" />
    </rect>

    <!-- Subtitle Lines -->
    <rect x="160" y="70" width="160" height="20" rx="10" fill="#334155"/>
    <rect x="160" y="110" width="120" height="20" rx="10" fill="#94a3b8"/>

    <!-- Timeline / Progress Bar at bottom -->
    <rect x="48" y="190" width="288" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="48" y="190" width="180" height="12" rx="6" fill="url(#primaryGradient)"/>
    
    <!-- AI Sparkle Icon -->
    <path d="M320 40 L330 20 L340 40 L360 50 L340 60 L330 80 L320 60 L300 50 Z" fill="#FFD700" />
     <path d="M290 80 L295 70 L300 80 L310 85 L300 90 L295 100 L290 90 L280 85 Z" fill="#FFD700" />
    
  </g>
</svg>
